aid: calysta
name: Calysta
description: 'Calysta, Inc. is a cellular agriculture company founded in 2012 and headquartered in
  San Mateo, California, with operations in Memphis, Tennessee (NouriTech), Wilton/Teesside in the
  United Kingdom (Calysta UK Ltd.) and Singapore (Calysta Asia Pte Ltd.). It produces protein
  ingredients through a patented gas-fermentation platform in which a naturally-occurring
  microorganism converts carbon and energy into a non-GMO single-cell protein, using no arable land
  and no plant or animal inputs. Its product family includes FeedKind for aquaculture and livestock,
  FeedKind Pet, FeedKind Net Zero and Positive Protein for human food ingredients; FeedKind Aqua is
  sold globally through Calysseo, a 50/50 joint venture with Adisseo whose first production plant in
  China manufactures thousands of tonnes per year. Calysta sells physical protein ingredients to feed
  and food manufacturers — its fermentation platform is industrial process technology, not commercial
  software — and it publishes no public API, developer portal, SDK, or machine-readable
  specification.'
